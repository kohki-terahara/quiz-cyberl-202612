<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>クイズ大会ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>

/* Layout: 司会者=操作パネル＋ライブ盤面の2カラム / 参加者=スマホ1カラム / #screen=プロジェクター用の大画面 */
:root{
  --bg:#eef1f9; --paper:#ffffff; --ink:#1b1f3b; --muted:#5d6385; --line:#d8dcee;
  --accent:#e23b4a; --gold:#e9a800; --ok:#168a5c; --blue:#2f5bea; --violet:#7a3fd1;
  --soft:#e3e8f7; --okSoft:#dcf3e8; --goldSoft:#fff3cf;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10132a; --paper:#191d3a; --ink:#eef0fb; --muted:#a3a8c9; --line:#2d3259;
  --accent:#ff5d69; --gold:#ffc83a; --ok:#3fd096; --blue:#7090ff; --violet:#ad86ff;
  --soft:#232852; --okSoft:#163a30; --goldSoft:#3a3216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10132a; --paper:#191d3a; --ink:#eef0fb; --muted:#a3a8c9; --line:#2d3259;
  --accent:#ff5d69; --gold:#ffc83a; --ok:#3fd096; --blue:#7090ff; --violet:#ad86ff;
  --soft:#232852; --okSoft:#163a30; --goldSoft:#3a3216; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--soft);font-weight:700}
button:hover{filter:brightness(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--accent);color:#fff}
.go{background:var(--ok);color:#fff}
.ghost{background:transparent;border:1.5px solid var(--line)}
.small{padding:5px 10px;font-size:13px;border-radius:8px}
.armed{background:var(--accent)!important;color:#fff!important}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:72px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.02em}
.logo b{color:var(--accent);font-weight:400}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:transparent;border:1.5px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--soft)}
.phase::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.phase.open::before{background:var(--ok);box-shadow:0 0 0 4px var(--okSoft)}
.phase.closed::before{background:var(--gold)}
.phase.revealed::before{background:var(--accent)}
.qno{font-family:var(--display);color:var(--accent);font-size:15px}
.qtext{font-size:clamp(18px,2.4vw,26px);font-weight:700;line-height:1.45}
.qimg{max-height:340px;width:auto;max-width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.vote{background:var(--goldSoft);color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);text-align:left;font-weight:700;border:2px solid transparent;min-width:0}
.opt .lt{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:15px}
.opt.sel{border-color:var(--ink)}
.opt.win{border-color:var(--ok);background:var(--okSoft)}
.opt .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.c0{background:var(--blue)}.c1{background:var(--accent)}.c2{background:var(--gold)}.c3{background:var(--ok)}.c4{background:var(--violet)}.c5{background:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:currentColor}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ac{background:var(--soft);border-radius:12px;padding:8px 12px;border:2px solid transparent;min-width:0}
.ac .nm{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.ac .v{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.ac.ok{border-color:var(--ok);background:var(--okSoft)}
.ac.ok .nm::after{content:"○";color:var(--ok);margin-left:auto;font-size:16px}
.ac.none .v{color:var(--muted);font-weight:400}
.reveal{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:12px;background:var(--okSoft)}
.reveal .big{font-family:var(--display);font-size:clamp(18px,3vw,30px)}
.lb{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.lb li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--soft)}
.lb .rk{font-family:var(--display);text-align:center;font-size:16px}
.lb .pn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sc{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:18px}
.lb .d{font-size:12px;color:var(--ok);font-weight:700;margin-left:6px}
.lb li.g1{background:var(--goldSoft)} .lb li.g1 .rk{color:var(--gold)}
.lb li.me{outline:2px solid var(--blue)}
.qlist{display:grid;gap:8px}
.qi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.qi.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.qi.done{opacity:.7}
.qi .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.grp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft);text-align:left;font-weight:400}
.grp.on{background:var(--okSoft);outline:2px solid var(--ok)}
.grp .mk{font-family:var(--display);width:28px;text-align:center;color:var(--muted)}
.grp.on .mk{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip.done{background:var(--okSoft)}
.empty{padding:28px;text-align:center;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.timer{display:grid;gap:6px}
.timer .thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--blue);transition:width .12s linear,background-color .3s}
.timer.warn .tbar i{background:var(--gold)}
.timer.danger .tbar i,.timer.over .tbar i{background:var(--accent)}
.tnum{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:24px;line-height:1.2}
.timer.over .tnum{color:var(--accent)}
.timer .tnote{font-size:12px;color:var(--muted);font-weight:700}
.scr .tbar{height:30px;border-radius:15px}
.scr .tnum{font-size:clamp(34px,4.4vw,64px)}
.scr .timer .tnote{font-size:clamp(14px,1.4vw,20px)}
.tctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--soft)}
.tctl input{width:84px}
@media (prefers-reduced-motion:no-preference){.timer.danger .tnum{animation:beat 1s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.08)}}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:20;max-width:90%}
/* プレイヤー */
.pv{max-width:560px;margin:0 auto;display:grid;gap:14px}
.pv .opt{padding:14px;font-size:17px}
.mine{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg)}
.mine .sc{font-family:var(--display);font-size:24px}
.result{font-family:var(--display);font-size:28px;text-align:center;padding:14px;border-radius:14px}
.result.ok{background:var(--okSoft);color:var(--ok)}
.result.ng{background:var(--soft);color:var(--muted)}
/* スクリーン */
.scr{max-width:1400px;margin:0 auto;display:grid;gap:22px}
.scr .qtext{font-size:clamp(24px,3.6vw,48px)}
.scr .opt{font-size:clamp(18px,2vw,28px);padding:16px 18px}
.scr .opt .lt{width:44px;height:44px;font-size:22px}
.scr .qimg{max-height:40vh;width:100%;object-fit:contain;border:0;border-radius:0;background:transparent}
.scr.open .qimg{max-height:calc(100vh - 300px);min-height:50vh}
.scr.open .panel{padding:12px 18px;gap:10px}
.sec{font-family:var(--display);font-size:14px;padding:2px 12px;border-radius:8px;background:var(--ink);color:var(--bg)}
.scr .sec{font-size:clamp(16px,1.8vw,26px);padding:4px 16px}
.scr .qno{font-size:clamp(16px,1.8vw,26px)}
.sechead{font-family:var(--display);font-size:15px;padding:6px 2px 4px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sechead button{margin-left:auto;font-family:var(--body)}
.phase.section::before{background:var(--violet)}
.secttl{display:grid;gap:14px;justify-items:center;text-align:center}
.secttl .secno{font-family:var(--display);letter-spacing:.2em;color:var(--accent);font-size:clamp(18px,2.4vw,34px)}
.secttl .hero{font-size:clamp(44px,8vw,120px);overflow-wrap:anywhere}
.secttl .cnt{font-size:clamp(18px,2.2vw,30px);color:var(--muted);font-weight:700}
.secttl .rule{width:min(320px,60%);height:6px;border-radius:3px;background:var(--accent)}
.panel .secttl .hero{font-size:clamp(30px,5vw,48px)}
.panel .secttl .secno{font-size:16px}
.panel .secttl .cnt{font-size:16px}
.sechead:first-child{padding-top:0}
.scrcenter{min-height:calc(100vh - 120px);display:grid;place-items:center;text-align:center}
.scrcenter .hero{font-size:clamp(44px,8vw,120px)}
.scr .ac .v{font-size:clamp(16px,1.6vw,22px)}
.scr .lb li{padding:12px 16px;grid-template-columns:56px minmax(0,1fr) auto}
.scr .lb .rk{font-size:26px}.scr .lb .pn{font-size:clamp(18px,2vw,26px)}.scr .lb .sc{font-size:clamp(22px,2.6vw,34px)}
.hero{font-family:var(--display);font-size:clamp(34px,6vw,80px);line-height:1.15}
.hero b{color:var(--accent);font-weight:400}
.count{font-family:var(--display);font-size:clamp(20px,2.4vw,32px);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}}

[hidden]{display:none!important}
img{max-width:100%}

body{margin:0}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;line-height:0}
.qr img,.qr canvas{display:block}
.joinbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.url{font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow-wrap:anywhere;background:var(--soft);padding:6px 10px;border-radius:8px}
.imgph{padding:40px;text-align:center;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}
code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.9em}
</style>

<script>

<script>
const $app=document.getElementById('app');
/* このファイルの版。更新するたびに数字を上げる。司会者が新しい版を開くと、古い版を開いたままの端末は自動で再読み込みする */
const APP_VER=6;
const LT='ABCDEF';
const TYPE={free:'自由回答',choice:'選択（正解あり）',vote:'選択（あとで正解決定）'};
let db=null;
const ME={uid:null,ready:false,setup:false,err:null};
const S={host:undefined,state:{phase:'lobby'},questions:[],results:{},players:{}};
let OFF=0;const now=()=>Date.now()+OFF; /* Firebaseのサーバー時刻に合わせた現在時刻 */
let tab='run',editing=null,editImg=null,uploading=false,draft=null,armed=null,armTimer=null,busy=false;
const vals={},IMG={};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s　、。,.!！?？・ー\-]/g,'');
const rid=p=>p+Math.random().toString(36).slice(2,9);
const joinUrl=()=>location.origin+location.pathname;
const isHost=()=>!!S.host&&S.host===ME.uid;
const view=()=>location.hash==='#screen'?'screen':location.hash==='#host'?'host':'player';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function errMsg(e){const c=String(e&&(e.code||e.message)||'').toUpperCase();if(c.includes('PERMISSION'))return '権限がないため保存できませんでした。Firebaseのルール設定を確認してください。';return '保存に失敗しました。通信状況を確認してもう一度お試しください。'}
async function W(fn){if(busy)return;busy=true;try{await fn()}catch(e){console.error(e);toast(errMsg(e))}finally{busy=false;render()}}

/* ---------- 派生データ ---------- */
const qById=id=>S.questions.find(q=>q.id===id);
/* セクション：問題ごとの任意のタイトル。番号はセクション内で 問題1, 問題2… と数える */
const secOf=q=>String(q&&q.section||'').trim();
function qIndexInSec(id){const q=qById(id);if(!q)return 0;const s=secOf(q);let n=0;for(const x of S.questions){if(secOf(x)===s)n++;if(x.id===id)return n}return 0}
const qLabel=q=>`${secOf(q)?`[${secOf(q)}] `:''}問題${qIndexInSec(q.id)}`;
const sections=()=>[...new Set(S.questions.map(secOf).filter(Boolean))];
function groupedList(rowFn,headFn=null){
  let prev=null,h='';
  S.questions.forEach((q,i)=>{const s=secOf(q);if(s!==prev){h+=`<div class="sechead"><span>${s?esc(s):'セクションなし'}</span>${headFn&&s?headFn(s):''}</div>`;prev=s}h+=rowFn(q,i)});
  return h;
}
const secQuestions=s=>S.questions.filter(q=>secOf(q)===s);
const secNo=s=>sections().indexOf(s)+1;
const curQ=()=>S.state.qid?qById(S.state.qid):null;
const playerList=()=>Object.entries(S.players).map(([uid,p])=>({uid,...p})).filter(p=>p.name).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
const ansOf=(p,qid)=>p.answers&&p.answers[qid];
function scores(){
  const sc={},cnt={};
  for(const p of playerList()){sc[p.uid]=0;cnt[p.uid]=0}
  for(const [qid,r] of Object.entries(S.results)){const q=qById(qid);if(!q)continue;for(const u of r.correct||[]){if(u in sc){sc[u]+=Number(q.points)||0;cnt[u]++}}}
  return {sc,cnt};
}
function lastDelta(){const q=curQ();if(!q||!S.results[q.id])return {};const d={};for(const u of S.results[q.id].correct||[])d[u]=Number(q.points)||0;return d}
function ranking(){
  const {sc,cnt}=scores();
  const list=playerList().map(p=>({...p,score:sc[p.uid],n:cnt[p.uid]})).sort((a,b)=>b.score-a.score||String(a.name).localeCompare(b.name,'ja'));
  let r=0,prev=null;list.forEach((p,i)=>{if(p.score!==prev){r=i+1;prev=p.score}p.rank=r});
  return list;
}
function ansText(q,a){if(!a)return null;if(q.type==='free')return String(a.v);const i=Number(a.v);return `${LT[i]||'?'}. ${q.options?.[i]??''}`}
function correctLabel(q,r){if(!r)return '';if(q.type==='free')return r.answerText||'（判定済み）';return r.answerIndex!=null?`${LT[r.answerIndex]}. ${q.options[r.answerIndex]}`:''}
function imgSrc(id){
  if(!id)return '';
  if(IMG[id]!==undefined)return IMG[id]||'';
  IMG[id]=null;
  db.ref('images/'+id).once('value').then(s=>{IMG[id]=s.val()||'';render()}).catch(()=>{IMG[id]=''});
  return '';
}
function imgTag(id,style=''){const s=imgSrc(id);return s?`<img class="qimg" src="${esc(s)}" alt="問題の画像" style="${style}">`:`<div class="imgph">画像を読み込み中…</div>`}

/* ---------- 共通パーツ ---------- */
function qBlock(q,{showPick=null,tally=false,win=null}={}){
  let h=`<div class="row">${secOf(q)?`<span class="sec">${esc(secOf(q))}</span>`:''}<span class="qno">問題${qIndexInSec(q.id)}</span><span class="tag ${q.type==='vote'?'vote':''}">${TYPE[q.type]}</span><span class="tag">${Number(q.points)||0}点</span></div>`;
  if(q.text)h+=`<div class="qtext">${esc(q.text)}</div>`;
  if(q.imageId)h+=imgTag(q.imageId);
  if(q.type!=='free'){
    const counts=q.options.map(()=>0);let tot=0;
    if(tally)for(const p of playerList()){const a=ansOf(p,q.id);if(a!=null){counts[a.v]=(counts[a.v]||0)+1;tot++}}
    h+=`<div class="opts">`+q.options.map((o,i)=>{
      const tag=showPick?'button':'div';
      const attr=showPick?` data-act="pick" data-arg="${i}"`:'';
      const cls=`opt ${showPick&&showPick.sel===i?'sel':''} ${win===i?'win':''}`;
      const pct=tot?Math.round(counts[i]/tot*100):0;
      return `<${tag} class="${cls}"${attr}><span class="lt c${i%6}">${LT[i]}</span><span style="min-width:0;flex:1">${esc(o)}${tally?`<div class="bar" style="color:var(--${['blue','accent','gold','ok','violet','muted'][i%6]})"><i style="width:${pct}%"></i></div>`:''}</span>${tally?`<span class="cnt">${counts[i]}票</span>`:''}</${tag}>`;
    }).join('')+`</div>`;
  }
  return h;
}
function answersGrid(q,{marks=false}={}){
  const r=S.results[q.id];const ok=new Set(marks&&r?r.correct:[]);

  if(!ps.length)return `<div class="empty">参加者がいません</div>`;
  return `<div class="ans">`+ps.map(p=>{const t=ansText(q,ansOf(p,q.id));
    return `<div class="ac ${ok.has(p.uid)?'ok':''} ${t==null?'none':''}"><div class="nm">${esc(p.name)}</div><div class="v">${t==null?'未回答':esc(t)}</div></div>`}).join('')+`</div>`;

function leaderboard({highlight=null}={}){
  const list=ranking();if(!list.length)return `<div class="empty">参加者がまだいません</div>`;

const answeredCount=q=>playerList().filter(p=>ansOf(p,q.id)).length;
function phaseChip(){const p=S.state.phase;const t={lobby:'待機中',open:'回答受付中',closed:'締切・回答一覧',revealed:'正解発表',board:'途中経過',section:'セクションのタイトル表示中'}[p]||p;return `<span class="phase ${p}">${t}</span>`}
/* ---------- タイマー（目安の表示だけ。0になっても回答は締め切らない） ---------- */
const timerOn=()=>S.state.phase==='open'&&S.state.timerStart&&S.state.timerDur>0;
function timerHtml(note=''){
  if(!timerOn())return '';
  return `<div class="timer" data-timer><div class="thead"><span class="tnum">--</span><span class="tnote" data-tnote="${esc(note)}"></span></div><div class="tbar"><i></i></div></div>`;
}
function tick(){
  const els=document.querySelectorAll('[data-timer]');if(!els.length)return;
  const dur=Number(S.state.timerDur)||0,rem=dur-(now()-Number(S.state.timerStart))/1000;
  const r=Math.max(0,Math.min(dur,rem)),pct=dur?r/dur*100:0,over=rem<=0;
  els.forEach(el=>{
    el.querySelector('.tbar i').style.width=pct+'%';
    el.querySelector('.tnum').textContent=over?'時間切れ':`${Math.ceil(r)}秒`;
    const n=el.querySelector('.tnote');n.textContent=over?n.dataset.tnote:`制限時間 ${dur}秒`;
    el.classList.toggle('over',over);el.classList.toggle('danger',!over&&r<=5);el.classList.toggle('warn',!over&&r>5&&r<=Math.min(10,dur/3));
  });
}
setInterval(tick,100);

function armBtn(act,arg,label,cls=''){const k=act+':'+(arg??'');const on=armed===k;

function runView(){

  if(!q||ph==='lobby'){
    main+=S.questions.length?`<p class="muted" style="margin:0">下の問題一覧から「出題」を押すと、参加者の画面に問題が表示されます。</p>`:`<div class="empty">まだ問題がありません。「問題作成」タブで追加してください。</div>`;

      main+=`<div class="row"><span class="count">${answeredCount(q)} / ${ps.length}</span><span class="muted">人が回答済み</span></div>
      <div class="chips">${ps.map(p=>`<span class="chip ${ansOf(p,q.id)?'done':''}">${ansOf(p,q.id)?'✓ ':''}${esc(p.name)}</span>`).join('')}</div>

    }
    if(ph==='board')main+=`<div class="row"><span class="muted">スクリーンにリーダーボードを表示中</span>${nextBtn(q)}</div>`;
  }
  main+=`</div>`;
  main+=`<div class="panel"><span class="label">問題一覧</span><div class="qlist">`+(groupedList((x,i)=>{
    const done=!!S.results[x.id],cur=q&&x.id===q.id&&ph!=='lobby'&&ph!=='section';
    return `<div class="qi ${cur?'cur':''} ${done?'done':''}"><span class="qno">${qIndexInSec(x.id)}</span><span class="t">${esc(x.text||'（画像の問題）')} <span class="tag">${TYPE[x.type]}</span>${x.imageId?' <span class="tag">画像</span>':''}</span>
    ${done&&!cur?armBtn('start',x.id,'再出題','small ghost'):`<button class="small ${cur?'ghost':'go'}" data-act="start" data-arg="${x.id}" ${ph==='open'&&!cur?'disabled':''}>出題</button>`}</div>`},
    s=>`<button class="small ${ph==='section'&&S.state.section===s?'ghost':''}" data-act="secshow" data-arg="${esc(s)}" ${ph==='open'?'disabled':''}>タイトル画面を表示</button>`)||`<div class="empty">問題がありません</div>`)+`</div></div>`;

  let side=`<div class="panel"><span class="label">参加用QRコード</span><div class="joinbox">${qrBox(140)}<div style="min-width:0;flex:1;display:grid;gap:6px"><span class="note">参加者はこのQRコードを読み取り、名前を入れるだけで参加できます。スクリーンには表示されないので、この画面を見せるか、URLを共有してください。</span><span class="url">${esc(joinUrl())}</span></div></div></div>`;

  ${ps.length?`<div class="qlist">${ps.map(p=>`<div class="row"><span style="flex:1;font-weight:700">${esc(p.name)}</span>${armBtn('kick',p.uid,'外す','small ghost')}</div>`).join('')}</div>`:`<p class="note" style="margin:0">参加者がQRコードから名前を登録すると、ここに並びます。</p>`}
  <div class="row">${armBtn('reset',null,'得点と回答をすべてリセット','small ghost')}</div>

function secTitle(s){

function nextBtn(q){const i=S.questions.findIndex(x=>x.id===q.id);const n=S.questions[i+1];
  if(n&&secOf(n)&&secOf(n)!==secOf(q))return `<button class="primary" data-act="secshow" data-arg="${esc(secOf(n))}">次へ（[${esc(secOf(n))}] のタイトル画面）</button><button class="small ghost" data-act="start" data-arg="${n.id}">タイトルを飛ばして出題</button>`;

function ensureDraft(q){
  if(draft&&draft.qid===q.id)return;
  const r=S.results[q.id];
  draft={qid:q.id,accepted:new Set(r?.accepted||[]),winner:r?.answerIndex??(q.type==='choice'?Number(q.correctIndex):null)};
  if(r?.answerText!=null)vals['j-text']=r.answerText;else delete vals['j-text'];
}
function freeGroups(q){
  const groups={};for(const p of playerList()){const a=ansOf(p,q.id);if(!a)continue;const k=norm(a.v);(groups[k]=groups[k]||{k,text:a.v,names:[]}).names.push(p.name)}
  return Object.values(groups).sort((a,b)=>b.names.length-a.names.length);
}

    h+=`<label class="f">正解として表示する答え<input type="text" id="j-text" data-keep placeholder="例：富士山" value="${esc(vals['j-text']??'')}"></label>`;

  const a=ansOf(me,q.id),r=S.results[q.id];
  h+=`<div class="panel"><div class="row">${phaseChip()}</div>${ph==='open'?timerHtml('締切まで回答・修正できます'):''}${ph==='open'?qBlock(q,{showPick:q.type!=='free'?{sel:a?Number(a.v):null}:null}):qBlock(q,{tally:q.type!=='free',win:ph==='revealed'&&r?r.answerIndex:null})}`;
  if(ph==='open'){
    if(q.type==='free')h+=`<label class="f">あなたの回答<input type="text" id="p-ans" data-keep maxlength="60" value="${esc(vals['p-ans']??(a?a.v:''))}"></label><button class="primary" data-act="submit">${a?'回答を更新':'回答する'}</button>`;
    h+=a?`<p class="note" style="margin:0">回答済み：<b>${esc(ansText(q,a))}</b>（締切まで変更できます）</p>`:`<p class="note" style="margin:0">${q.type==='free'?'入力して「回答する」を押してください。':'選択肢をタップすると回答になります。'}</p>`;
  }
  if(ph==='closed')h+=`<p style="margin:0">締切！あなたの回答：<b>${a?esc(ansText(q,a)):'未回答'}</b></p>`;
  if(ph==='revealed'&&r){const ok=(r.correct||[]).includes(ME.uid);h+=`<div class="result ${ok?'ok':'ng'} pop">${ok?`正解！ +${q.points}点`:'残念…'}</div><div class="reveal"><span class="label">正解</span><span class="big">${esc(correctLabel(q,r))}</span></div>`}
  h+=`</div>`;
  if(ph!=='open')h+=`<div class="panel"><span class="label">みんなの回答</span>${answersGrid(q,{marks:ph==='revealed'})}</div>`;
  if(ph==='revealed')h+=`<div class="panel"><span class="label">リーダーボード</span>${leaderboard({highlight:ME.uid})}</div>`;
  return h+`</div>`;
}

/* ---------- 案内画面 ---------- */
function msgView(title,body){return `<div class="panel" style="max-width:640px;margin:0 auto"><h2>${title}</h2>${body}</div>`}

/* ---------- 描画 ---------- */
function render(){
  const ae=document.activeElement,fid=ae&&ae.id,ss=ae&&'selectionStart' in ae?(()=>{try{return [ae.selectionStart,ae.selectionEnd]}catch(e){return null}})():null;
  let html,cls='';
  if(ME.setup)html=msgView('Firebase の設定がまだです','<p style="margin:0">このファイルの「ここから」〜「ここまで」の部分に、Firebase の設定（firebaseConfig）を貼り付けてください。くわしくは設定手順書の「手順3」を見てください。</p>');
  else if(ME.err)html=msgView('接続できませんでした',`<p style="margin:0">${esc(ME.err)}</p>`);
  else if(!ME.ready||S.host===undefined)html=`<div class="empty">接続中…</div>`;
  else{
    const v=view();
    if(v==='screen'){html=screenView()}
    else if(v==='host'){html=isHost()?hostView():claimView();cls='wrap'}
    else html=playerView();
  }
  $app.className=cls;
  $app.innerHTML=html;
  document.querySelectorAll('[data-qr]').forEach(el=>{
    if(!window.QRCode){el.textContent='QRコードを表示できませんでした';return}
    const n=Number(el.dataset.size)||160;
    new QRCode(el,{text:el.dataset.qr,width:n,height:n,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  });
  tick();
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(ss&&el.setSelectionRange)try{el.setSelectionRange(ss[0],ss[1])}catch(e){}}}
}
window.addEventListener('hashchange',render);

/* ---------- 書き込み ---------- */
const setState=patch=>db.ref('game/state').set({...S.state,...patch,at:Date.now()});
const saveQuestions=l=>db.ref('game/questions').set(JSON.stringify(l));
const saveResults=r=>db.ref('game/results').set(JSON.stringify(r));
function arm(k){if(armed===k){armed=null;clearTimeout(armTimer);return true}armed=k;clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=null;render()},3500);render();return false}

function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const k=Math.min(1,1920/Math.max(im.width,im.height));const w=Math.round(im.width*k),h=Math.round(im.height*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  res(c.toDataURL('image/jpeg',0.82))};im.src=fr.result};fr.readAsDataURL(file)})}

document.addEventListener('input',e=>{const el=e.target;if(el.id&&el.hasAttribute('data-keep')){vals[el.id]=el.value;if(el.hasAttribute('data-rerender'))render()}});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id&&el.hasAttribute('data-keep')&&el.tagName==='SELECT'){vals[el.id]=el.value;if(el.hasAttribute('data-rerender'))render()}
  if(el.id==='f-img'&&el.files&&el.files[0]){
    uploading=true;render();
    try{const url=await shrink(el.files[0]);const id=rid('img');await db.ref('images/'+id).set(url);IMG[id]=url;editImg=id;toast('画像を追加しました')}
    catch(err){console.error(err);toast('画像を保存できませんでした。別の画像でお試しください')}
    uploading=false;render();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){if(e.target.id==='p-name'){e.preventDefault();act('join')}if(e.target.id==='p-ans'){e.preventDefault();act('submit')}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg)});

function openEditor(id){
  const last=(editing&&qById(editing))||S.questions[S.questions.length-1]; /* 直前に編集していた問題 */
  editing=id;const q=id==='new'?null:qById(id);
  vals['f-sec']=q?secOf(q):secOf(last); /* 新しい問題は直前のセクションを引き継ぐ */
  vals['f-type']=q?q.type:'free';vals['f-text']=q?q.text:'';vals['f-opts']=q&&q.options?q.options.join('\n'):'';
  vals['f-correct']=q&&q.correctIndex!=null?String(q.correctIndex):'0';vals['f-points']=q?String(q.points):'10';vals['f-time']=q&&q.time?String(q.time):'30';
  editImg=q?q.imageId||null:null;render();
}

async function act(a,arg){
  switch(a){
    case 'tab':tab=arg;return render();
    case 'screen':location.hash='screen';return;
    case 'unscreen':location.hash=isHost()?'host':'';if(!isHost())history.replaceState(null,'',location.pathname);return render();
    case 'tohost':location.hash='host';return;
    case 'claim':return W(async()=>{await db.ref('host').transaction(cur=>cur?undefined:ME.uid);toast('司会者として登録しました')});
    /* 参加者 */
    case 'join':{const name=(vals['p-name']||'').trim().slice(0,16);if(!name)return toast('名前を入力してください');
      return W(async()=>{const p=S.players[ME.uid];await db.ref('players/'+ME.uid).update({name,joinedAt:(p&&p.joinedAt)||Date.now()});toast('エントリーしました')})}
    case 'rename':{const p=S.players[ME.uid];vals['p-name']=p?p.name:'';return W(()=>db.ref('players/'+ME.uid+'/name').remove())}
    case 'pick':{const q=curQ();if(!q||S.state.phase!=='open')return;return W(()=>db.ref(`players/${ME.uid}/answers/${q.id}`).set({v:Number(arg),t:Date.now()}))}
    case 'submit':{const q=curQ();if(!q||S.state.phase!=='open')return;const v=(vals['p-ans']??'').trim().slice(0,60);if(!v)return toast('回答を入力してください');
      return W(async()=>{await db.ref(`players/${ME.uid}/answers/${q.id}`).set({v,t:Date.now()});delete vals['p-ans'];toast('回答しました')})}
    /* 司会者：進行 */
    case 'start':{
      if(S.results[arg]&&!(armed==='start:'+arg)){ if(!arm('start:'+arg))return }
      else if(armed==='start:'+arg){armed=null}
      return W(async()=>{draft=null;const up={};
        if(S.results[arg]){const res={...S.results};delete res[arg];up['game/results']=JSON.stringify(res);for(const p of playerList())up[`players/${p.uid}/answers/${arg}`]=null}
        delete vals['t-sec'];
        up['game/state']={...S.state,phase:'open',qid:arg,at:Date.now(),timerStart:null,timerDur:null};
        await db.ref().update(up)})}
    case 'tstart':{const q=curQ();const sec=Math.round(Number(vals['t-sec']??(q&&q.time)??30));
      if(!(sec>=1&&sec<=3600))return toast('秒数は1〜3600の数字で入れてください');
      return W(()=>setState({timerStart:now(),timerDur:sec}))}
    case 'tadd':if(!timerOn())return;return W(()=>{const rem=Number(S.state.timerDur)-(now()-Number(S.state.timerStart))/1000;
      return rem>0?setState({timerDur:Number(S.state.timerDur)+10}):setState({timerStart:now(),timerDur:10})});
    case 'tstop':return W(()=>setState({timerStart:null,timerDur:null}));
    case 'secshow':{const first=secQuestions(arg)[0];if(!first)return toast('このセクションに問題がありません');
      draft=null;return W(()=>setState({phase:'section',section:arg,qid:first.id,timerStart:null,timerDur:null}))}
    case 'close':return W(()=>setState({phase:'closed'}));
    case 'reopen':return W(()=>setState({phase:'open'}));
    case 'accept':{if(draft.accepted.has(arg))draft.accepted.delete(arg);else draft.accepted.add(arg);
      if(!vals['j-text']&&draft.accepted.has(arg)){const g=freeGroups(curQ()).find(x=>x.k===arg);if(g)vals['j-text']=g.text}
      return render()}
    case 'winner':draft.winner=Number(arg);return render();
    case 'reveal':{const q=curQ();if(!q)return;ensureDraft(q);
      const correct=[];let rec;
      for(const p of playerList()){const x=ansOf(p,q.id);if(!x)continue;
        if(q.type==='free'?draft.accepted.has(norm(x.v)):Number(x.v)===draft.winner)correct.push(p.uid)}
      if(q.type==='free'){const g=freeGroups(q).filter(x=>draft.accepted.has(x.k)).map(x=>x.text);
        rec={correct,accepted:[...draft.accepted],answerText:(vals['j-text']||'').trim()||g.join(' / ')||'正解者なし'}}
      else rec={correct,answerIndex:draft.winner};
      return W(async()=>{await db.ref().update({'game/results':JSON.stringify({...S.results,[q.id]:rec}),'game/state':{...S.state,phase:'revealed',at:Date.now()}})})}
    case 'rejudge':draft=null;return W(()=>setState({phase:'closed'}));
    case 'board':return W(()=>setState({phase:'board'}));
    case 'lobby':return W(()=>setState({phase:'lobby'}));
    case 'kick':if(!arm('kick:'+arg))return;return W(()=>db.ref('players/'+arg).remove());
    case 'reset':if(!arm('reset:'))return;return W(async()=>{draft=null;const up={'game/results':JSON.stringify({}),'game/state':{phase:'lobby',at:Date.now()}};
      for(const p of playerList())up[`players/${p.uid}/answers`]=null;await db.ref().update(up);toast('リセットしました')});
    /* 司会者：問題作成 */
    case 'new':return openEditor('new');
    case 'edit':return openEditor(arg);
    case 'cancel':editing=null;return render();
    case 'img-remove':editImg=null;return render();
    case 'up':case 'down':{const l=[...S.questions];const i=l.findIndex(q=>q.id===arg);const j=a==='up'?i-1:i+1;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];return W(()=>saveQuestions(l))}
    case 'del':if(!arm('del:'+arg))return;return W(async()=>{const q=qById(arg);await saveQuestions(S.questions.filter(x=>x.id!==arg));if(q&&q.imageId)await db.ref('images/'+q.imageId).remove();editing=null;toast('削除しました')});
    case 'save':{
      const type=vals['f-type']||'free',text=(vals['f-text']||'').trim(),points=Math.max(0,Math.round(Number(vals['f-points'])||0));
      if(!text&&!editImg)return toast('問題文か画像を入れてください');
      const time=Math.max(1,Math.round(Number(vals['f-time'])||30));
      const q={id:editing==='new'?rid('q'):editing,type,text,points,time};
      if(editImg)q.imageId=editImg;
      const sec=(vals['f-sec']||'').trim().slice(0,30);if(sec)q.section=sec;
      if(type!=='free'){const o=(vals['f-opts']||'').split('\n').map(s=>s.trim()).filter(Boolean);
        if(o.length<2||o.length>6)return toast('選択肢は2〜6個にしてください');q.options=o;
        if(type==='choice')q.correctIndex=Math.min(Number(vals['f-correct']||0),o.length-1)}
      let l=[...S.questions];const i=l.findIndex(x=>x.id===q.id);
      if(i>=0&&secOf(l[i])===sec)l[i]=q;
      else{ /* 新規・セクション変更：同じセクションの最後の問題の後ろに置く（なければ末尾） */
        l=l.filter(x=>x.id!==q.id);let at=-1;l.forEach((x,j)=>{if(secOf(x)===sec)at=j});
        if(at>=0)l.splice(at+1,0,q);else l.push(q);
      }
      return W(async()=>{await saveQuestions(l);editing=q.id;toast('保存しました')})}
  }
}

/* ---------- 起動 ---------- */
function parse(s,fb){try{return s?JSON.parse(s):fb}catch(e){return fb}}
function syncVer(){
  if(S.appVer===undefined)return;
  if(isHost()&&S.appVer<APP_VER){db.ref('game/appVer').set(APP_VER).catch(()=>{});return}
  if(S.appVer>APP_VER){
    const k='quiz-reload-'+S.appVer;let tried=false;try{tried=!!sessionStorage.getItem(k);sessionStorage.setItem(k,'1')}catch(e){}
    if(!tried){location.replace(location.pathname+'?v='+S.appVer+location.hash);return}
    toast('新しい版があります。ページを再読み込みしてください');
  }
}
function subscribe(){
  const fail=e=>{console.error(e);ME.err='データを読み込めませんでした。Firebase の Realtime Database とルールの設定を確認してください。';render()};
  db.ref('host').on('value',s=>{S.host=s.val()||null;syncVer();render()},fail);
  db.ref('game/appVer').on('value',s=>{S.appVer=Number(s.val())||0;syncVer()},()=>{});
  db.ref('.info/serverTimeOffset').on('value',s=>{OFF=Number(s.val())||0});
  db.ref('game/state').on('value',s=>{S.state=s.val()||{phase:'lobby'};render()},fail);
  db.ref('game/questions').on('value',s=>{S.questions=parse(s.val(),[]);render()},fail);
  db.ref('game/results').on('value',s=>{S.results=parse(s.val(),{});render()},fail);
  db.ref('players').on('value',s=>{S.players=s.val()||{};render()},fail);
}
render();
if(!window.firebase||!firebaseConfig.apiKey||!firebaseConfig.databaseURL){ME.setup=!!window.firebase;if(!window.firebase)ME.err='Firebase を読み込めませんでした。インターネット接続を確認してください。';render()}
else{
  firebase.initializeApp(firebaseConfig);
  db=firebase.database();
  let started=false;
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){try{await firebase.auth().signInAnonymously()}catch(e){console.error(e);ME.err='ログインできませんでした。Firebase の「Authentication」で「匿名」ログインが有効になっているか確認してください。';render()}return}
    ME.uid=u.uid;ME.ready=true;if(!started){started=true;subscribe()}render();
  });
}
</script>
